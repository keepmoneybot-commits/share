<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBVKKpqONITfxJ5sG3ajiZmyks0qXJ78PE",
        authDomain: "share-4b1cb.firebaseapp.com",
        projectId: "share-4b1cb",
        storageBucket: "share-4b1cb.firebasestorage.app",
        messagingSenderId: "616764535308",
        appId: "1:616764535308:web:1c987d881624b03cafb429"
    };
    
    const urlParams = new URLSearchParams(window.location.search);
    let appId = urlParams.get('room'); 

    let db;
    let auth;
    let roomConfig = null;
    let myRole = appId ? localStorage.getItem(`split_role_${appId}`) : null;
    let expensesList = [];
    let finalCalculatedAmount = 0;
    let searchTerm = '';
    let selectedDate = '';
    let currentMyBalance = 0;

    async function init() {
        try {
            if (!firebaseConfig || !firebaseConfig.apiKey) {
                showToast("找不到 Firebase 設定！");
                hideLoading();
                return;
            }
            
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initFlow = async () => {
                await signInAnonymously(auth);
                await checkRoomExists();
            };

            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error('連線逾時，請確認網路狀態或資料庫權限設定。')), 10000)
            );
            
            await Promise.race([initFlow(), timeoutPromise]);
        } catch (err) {
            console.error("Firebase init failed:", err);
            hideLoading();
            const setupScreen = document.getElementById('setupScreen');
            setupScreen.innerHTML = `
                <div class="bg-white p-8 rounded-3xl shadow-lg w-full text-center">
                    <div class="text-red-500 font-bold text-xl mb-2">連線發生錯誤 ❌</div>
                    <div class="text-sm text-gray-600 text-left bg-gray-100 p-3 rounded-lg overflow-auto break-all">
                        ${err.message}
                    </div>
                </div>`;
            setupScreen.classList.remove('hidden');
        }
    }

    async function checkRoomExists() {
        if (!auth.currentUser) return;
        
        if (!appId) {
            showSetup();
            return;
        }

        myRole = localStorage.getItem(`split_role_${appId}`);
        
        try {
            const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'roomInfo', 'config');
            const docSnap = await getDoc(roomRef);
            if (docSnap.exists()) {
                roomConfig = docSnap.data();
                if (myRole && (myRole === 'userA' || myRole === 'userB')) {
                    startApp();
                } else {
                    showRoleSelection();
                }
            } else {
                window.location.href = window.location.pathname;
            }
        } catch (err) {
            console.error("Error checking room:", err);
            showToast("讀取資料失敗，請重新整理頁面。");
            hideLoading();
        }
    }

    function hideLoading() {
        const ls = document.getElementById('loadingScreen');
        if (ls) {
            ls.classList.add('opacity-0');
            setTimeout(() => { ls.classList.add('hidden'); }, 500);
        }
    }

    function showSetup() {
        hideLoading();
        document.getElementById('setupScreen').classList.remove('hidden');
    }

    function showRoleSelection() {
        hideLoading();
        document.getElementById('displayRoleA').textContent = roomConfig.userA;
        document.getElementById('displayRoleB').textContent = roomConfig.userB;
        document.getElementById('roleSelectionScreen').classList.remove('hidden');
    }

    function showAppInterface() {
        hideLoading();
        document.getElementById('setupScreen').classList.add('hidden');
        document.getElementById('roleSelectionScreen').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        
        const myName = myRole === 'userA' ? roomConfig.userA : roomConfig.userB;
        const partnerName = myRole === 'userA' ? roomConfig.userB : roomConfig.userA;
        
        document.getElementById('currentIdentityName').textContent = myName;
        document.getElementById('labelPaidByMe').textContent = myName + ' 付的';
        document.getElementById('labelPaidByThem').textContent = partnerName + ' 付的';
    }

    document.getElementById('btnCreateRoom').addEventListener('click', async () => {
        const nameA = document.getElementById('setupNameA').value.trim();
        const nameB = document.getElementById('setupNameB').value.trim();
        
        if (!nameA || !nameB) {
            showToast("請輸入雙方的稱呼！");
            return;
        }

        const btn = document.getElementById('btnCreateRoom');
        btn.innerHTML = '<div class="spinner border-2 mx-auto"></div>';
        btn.disabled = true;

        try {
            const newRoomId = Math.random().toString(36).substring(2, 10);
            const roomRef = doc(db, 'artifacts', newRoomId, 'public', 'data', 'roomInfo', 'config');
            await setDoc(roomRef, {
                userA: nameA,
                userB: nameB,
                createdAt: Date.now()
            });
            
            localStorage.setItem(`split_role_${newRoomId}`, 'userA');
            window.location.href = `?room=${newRoomId}`;
        } catch (err) {
            console.error("Creation failed", err);
            showToast("建立失敗，請確認權限。");
            btn.innerHTML = '開始記帳';
            btn.disabled = false;
        }
    });

    window.selectRole = function(role) {
        localStorage.setItem(`split_role_${appId}`, role);
        myRole = role;
        startApp();
    };

    function startApp() {
        showAppInterface();
        listenToExpenses();
    }

    function listenToExpenses() {
        const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
        
        onSnapshot(expensesRef, (snapshot) => {
            expensesList = [];
            snapshot.forEach((doc) => {
                expensesList.push({ id: doc.id, ...doc.data() });
            });
            
            expensesList.sort((a, b) => b.timestamp - a.timestamp);
            updateUI();
        }, (error) => {
            console.error("Listen error:", error);
            showToast("無法同步資料。");
        });
    }

    function updateUI() {
        let myBalance = 0;
        const partnerName = myRole === 'userA' ? roomConfig.userB : roomConfig.userA;
        
        const listEl = document.getElementById('expenseList');
        const emptyEl = document.getElementById('emptyState');
        listEl.innerHTML = '';
        
        expensesList.forEach(exp => {
            const amount = parseFloat(exp.amount);
            const impactAmount = exp.isSplit ? (amount / 2) : amount;
            if (exp.paidBy === myRole) {
                myBalance += impactAmount;
            } else {
                myBalance -= impactAmount;
            }
        });

        let displayList = expensesList.filter(exp => {
            let matchSearch = true;
            let matchDate = true;
            
            if (searchTerm) {
                matchSearch = exp.name.toLowerCase().includes(searchTerm);
            }
            if (selectedDate) {
                const expDateObj = new Date(exp.timestamp);
                const offset = expDateObj.getTimezoneOffset();
                const expDateStr = new Date(expDateObj.getTime() - (offset*60*1000)).toISOString().split('T')[0];
                matchDate = (expDateStr === selectedDate);
            }
            return matchSearch && matchDate;
        });

        if (displayList.length === 0) {
            emptyEl.classList.remove('hidden');
            if (searchTerm || selectedDate) {
                emptyEl.innerHTML = `<div class="text-4xl mb-3">🔍</div><p class="text-gray-400 font-medium">找不到符合條件的紀錄</p>`;
            } else {
                emptyEl.innerHTML = `<div class="text-4xl mb-3">📝</div><p class="text-gray-400 font-medium">目前還沒有任何記帳紀錄喔！</p>`;
            }
            listEl.classList.add('hidden');
        } else {
            emptyEl.classList.add('hidden');
            listEl.classList.remove('hidden');
        }

        displayList.forEach(exp => {
            const amount = parseFloat(exp.amount);
            const impactAmount = exp.isSplit ? (amount / 2) : amount;
            let myImpactForThisRow = 0;
            
            if (exp.paidBy === myRole) {
                myImpactForThisRow = impactAmount;
            } else {
                myImpactForThisRow = -impactAmount;
            }

            const li = document.createElement('div');
            li.className = 'p-5 hover:bg-gray-50 transition-colors flex justify-between items-center group';
            
            const iPaid = exp.paidBy === myRole;
            const payerText = iPaid ? '你先付了' : `${partnerName} 先付了`;
            
            let impactColor = myImpactForThisRow > 0 ? 'text-emerald-500' : (myImpactForThisRow < 0 ? 'text-rose-500' : 'text-gray-500');
            let impactSign = myImpactForThisRow > 0 ? '+' : '';
            let impactDisplay = myImpactForThisRow !== 0 ? `${impactSign}$${Math.abs(myImpactForThisRow).toLocaleString()}` : '$0';
            
            const dateStr = new Date(exp.timestamp).toLocaleDateString('zh-TW', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

            li.innerHTML = `
                <div class="flex-1 pr-4">
                    <div class="flex items-center space-x-2 mb-1">
                        <span class="font-bold text-gray-800 text-lg">${exp.name}</span>
                        <span class="text-xs bg-gray-200 text-gray-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">${payerText} $${amount.toLocaleString()}</span>
                        ${exp.isSplit ? `<span class="text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">平分</span>` : `<span class="text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded-full font-medium whitespace-nowrap">不平分</span>`}
                    </div>
                    <div class="text-sm text-gray-500">
                        對你影響：<span class="font-semibold ${impactColor}">${impactDisplay}</span>
                        <span class="text-xs text-gray-400 ml-2">${dateStr}</span>
                    </div>
                </div>
                <button onclick="deleteExpense('${exp.id}')" class="text-gray-300 hover:text-red-500 focus:outline-none p-2 rounded-full hover:bg-red-50 transition-all opacity-100 md:opacity-0 group-hover:opacity-100 flex-shrink-0" title="刪除此筆">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                </button>
            `;
            listEl.appendChild(li);
        });

        const board = document.getElementById('balanceBoard');
            const bAmount = document.getElementById('balanceAmount');
            const bStatus = document.getElementById('balanceStatus');
            
            myBalance = Math.round(myBalance * 100) / 100;
            currentMyBalance = myBalance; // 👈 補上這行，結清按鈕就能抓到正確餘額了！

            // 每次畫面更新時，同步更新搜尋的常用動態標籤
            updateDynamicTags();

            if (myBalance === 0) {
            bAmount.textContent = '$0';
            bStatus.textContent = '雙方目前已結清 🤝';
            board.className = 'bg-gray-400 text-white p-8 text-center transition-colors duration-500';
        } else if (myBalance > 0) {
            bAmount.textContent = '$' + myBalance.toLocaleString();
            bStatus.textContent = `${partnerName} 需給你 💰`;
            board.className = 'bg-emerald-500 text-white p-8 text-center transition-colors duration-500';
        } else {
            bAmount.textContent = '$' + Math.abs(myBalance).toLocaleString();
            bStatus.textContent = `你需給 ${partnerName} 💸`;
            board.className = 'bg-rose-500 text-white p-8 text-center transition-colors duration-500';
        }
    }

    document.getElementById('expenseForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const itemName = document.getElementById('itemName').value.trim();
        const paidBySelection = document.querySelector('input[name="paidBy"]:checked').value;
        const isSplit = document.getElementById('isSplit').checked;

        if (!itemName || finalCalculatedAmount <= 0) {
            showToast("請填寫名稱並確認金額大於0");
            return;
        }
        
        const btn = document.getElementById('btnSubmitExpense');
        const originalText = btn.innerHTML;
        btn.innerHTML = '<div class="spinner border-2"></div>';
        btn.disabled = true;

        const actualPaidBy = paidBySelection === 'me' ? myRole : (myRole === 'userA' ? 'userB' : 'userA');

        try {
            const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
            await addDoc(expensesRef, {
                name: itemName,
                amount: finalCalculatedAmount,
                paidBy: actualPaidBy,
                isSplit: isSplit,
                timestamp: Date.now()
            });
            
            document.getElementById('itemName').value = '';
            document.getElementById('amountDisplay').value = '';
            finalCalculatedAmount = 0;
        } catch (err) {
            console.error("Add error:", err);
            showToast("新增失敗！");
        } finally {
            btn.innerHTML = originalText;
            btn.disabled = false;
        }
    });

    window.deleteExpense = async function(id) {
        try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'expenses', id));
        } catch(err) {
            console.error("Delete error", err);
            showToast("刪除失敗");
        }
    };

    window.openSettleModal = function() {
        if(expensesList.length === 0) return;
        const m = document.getElementById('confirmModal');
        const c = document.getElementById('modalContent');
        m.classList.remove('hidden');
        setTimeout(() => {
            m.classList.remove('opacity-0');
            c.classList.remove('scale-95');
        }, 10);
    };

    window.closeSettleModal = function() {
        const m = document.getElementById('confirmModal');
        const c = document.getElementById('modalContent');
        m.classList.add('opacity-0');
        c.classList.add('scale-95');
        setTimeout(() => m.classList.add('hidden'), 300);
    };

    window.confirmSettle = async function() {
        if (currentMyBalance === 0) {
            showToast("目前帳務已經是結清狀態囉！");
            closeSettleModal();
            return;
        }

        const btn = document.getElementById('btnConfirmSettle');
        btn.innerHTML = '<div class="spinner border-2"></div>';
        btn.disabled = true;
        
        try {
            const settleAmount = Math.abs(currentMyBalance);
            const paidByRole = currentMyBalance > 0 ? (myRole === 'userA' ? 'userB' : 'userA') : myRole;

            const expensesRef = collection(db, 'artifacts', appId, 'public', 'data', 'expenses');
            await addDoc(expensesRef, {
                name: "💰 結清帳務",
                amount: settleAmount,
                paidBy: paidByRole,
                isSplit: false,
                timestamp: Date.now()
            });
            
            closeSettleModal();
            showToast("已成功新增結清紀錄！");
        } catch(err) {
            console.error("Settle error", err);
            showToast("結清失敗");
        } finally {
            btn.innerHTML = '確認結清';
            btn.disabled = false;
        }
    };

    window.shareLink = function() {
        const url = window.location.href;
        if (url.startsWith('blob:') || url.includes('scf.usercontent.goog')) {
            showToast("⚠️ 目前為預覽模式！請將此檔案部署至正式網址後再分享。");
            return;
        }

        if (navigator.clipboard && window.isSecureContext) {
            navigator.clipboard.writeText(url).then(() => {
                showToast("✅ 已複製專屬網址，快傳給對方吧！");
            }).catch(err => {
                fallbackCopyTextToClipboard(url);
            });
        } else {
            fallbackCopyTextToClipboard(url);
        }
    };
    
    function fallbackCopyTextToClipboard(text) {
        var textArea = document.createElement("textarea");
        textArea.value = text;
        textArea.style.top = "0";
        textArea.style.left = "0";
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
            document.execCommand('copy');
            showToast("✅ 已複製專屬網址，快傳給對方吧！");
        } catch (err) {
            showToast("複製失敗，請手動複製網址列。");
        }
        document.body.removeChild(textArea);
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.remove('opacity-0', 'pointer-events-none');
        setTimeout(() => {
            t.classList.add('opacity-0', 'pointer-events-none');
        }, 3000);
    }

    let calcExp = '';
    const calcModal = document.getElementById('calcModal');
    const calcSheet = document.getElementById('calcSheet');
    const amountDisplay = document.getElementById('amountDisplay');
    const calcEquation = document.getElementById('calcEquation');
    const calcResult = document.getElementById('calcResult');

    amountDisplay.addEventListener('click', () => {
        calcExp = finalCalculatedAmount > 0 ? finalCalculatedAmount.toString() : '';
        updateCalcDisplay();
        calcModal.classList.remove('hidden');
        setTimeout(() => {
            calcModal.classList.remove('opacity-0');
            calcSheet.classList.remove('translate-y-full');
        }, 10);
    });

    window.closeCalculator = function() {
        calcModal.classList.add('opacity-0');
        calcSheet.classList.add('translate-y-full');
        setTimeout(() => { calcModal.classList.add('hidden'); }, 300);
    };

    document.querySelectorAll('.calc-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.preventDefault();
            const val = e.target.getAttribute('data-val');
            
            if (val === 'C') {
                calcExp = '';
            } else if (val === 'DEL') {
                calcExp = calcExp.slice(0, -1);
            } else if (val === 'OK') {
                evaluateCalc();
                amountDisplay.value = finalCalculatedAmount > 0 ? '$' + finalCalculatedAmount.toLocaleString() : '';
                closeCalculator();
                return;
            } else {
                const lastChar = calcExp.slice(-1);
                const isOperator = ['+', '-', '*', '/'].includes(val);
                const isLastOperator = ['+', '-', '*', '/'].includes(lastChar);
                
                if (isOperator && calcExp === '') return;
                if (isOperator && isLastOperator) {
                    calcExp = calcExp.slice(0, -1) + val;
                } else {
                    calcExp += val;
                }
            }
            updateCalcDisplay();
        });
    });

    function updateCalcDisplay() {
        calcEquation.textContent = calcExp || '';
        evaluateCalc(false);
    }

    function evaluateCalc(finalize = true) {
        if (!calcExp) {
            calcResult.textContent = '0';
            if(finalize) finalCalculatedAmount = 0;
            return;
        }
        
        try {
            const sanitized = calcExp.replace(/[^0-9+\-*/.]/g, '');
            let result = new Function('return ' + sanitized)();
            
            if (result === Infinity || isNaN(result)) {
                calcResult.textContent = '錯誤';
                if(finalize) finalCalculatedAmount = 0;
            } else {
                result = Math.round(result * 100) / 100;
                calcResult.textContent = result.toLocaleString();
                if(finalize) finalCalculatedAmount = result > 0 ? result : 0;
            }
        } catch (e) {
            calcResult.textContent = '...';
        }
    }

    const searchModal = document.getElementById('searchModal');
    const searchSheet = document.getElementById('searchSheet');
    const searchInput = document.getElementById('searchInputBottomSheet');
    
    window.openSearchModal = function() {
        searchModal.classList.remove('hidden');
        setTimeout(() => {
            searchModal.classList.remove('opacity-0');
            searchSheet.classList.remove('translate-y-full');
            searchInput.focus();
        }, 10);
    };
    window.closeSearchModal = function() {
        searchModal.classList.add('opacity-0');
        searchSheet.classList.add('translate-y-full');
        setTimeout(() => searchModal.classList.add('hidden'), 300);
    };
    
    window.setSearchTag = function(tag) {
        searchInput.value = tag;
        searchTerm = tag.toLowerCase();
        updateUI();
        closeSearchModal();
    };

    searchInput.addEventListener('input', (e) => {
        searchTerm = e.target.value.trim().toLowerCase();
        updateUI();
    });

    const calendarModal = document.getElementById('calendarModal');
    const calendarSheet = document.getElementById('calendarSheet');
    const dateInput = document.getElementById('dateFilterBottomSheet');

    window.openCalendarModal = function() {
        calendarModal.classList.remove('hidden');
        setTimeout(() => {
            calendarModal.classList.remove('opacity-0');
            calendarSheet.classList.remove('translate-y-full');
        }, 10);
    };
    window.closeCalendarModal = function() {
        calendarModal.classList.add('opacity-0');
        calendarSheet.classList.add('translate-y-full');
        setTimeout(() => calendarModal.classList.add('hidden'), 300);
    };

    dateInput.addEventListener('change', (e) => {
        selectedDate = e.target.value;
        updateUI();
    });

    document.getElementById('clearDateBtn').addEventListener('click', (e) => {
        e.preventDefault();
        selectedDate = '';
        dateInput.value = '';
        updateUI();
        closeCalendarModal();
    });

    function changeDateBy(days) {
        let currentDate = selectedDate ? new Date(selectedDate) : new Date();
        currentDate.setDate(currentDate.getDate() + days);
        const offset = currentDate.getTimezoneOffset();
        const targetDate = new Date(currentDate.getTime() - (offset*60*1000));
        selectedDate = targetDate.toISOString().split('T')[0];
        
        dateInput.value = selectedDate;
        updateUI();
    }

    document.getElementById('prevDayBtn').addEventListener('click', (e) => {
        e.preventDefault();
        changeDateBy(-1);
    });
    
    document.getElementById('nextDayBtn').addEventListener('click', (e) => {
        e.preventDefault();
        changeDateBy(1);
    });

    // ======= 動態生成常用搜尋標籤 =======
        window.updateDynamicTags = function() {
            const nameCounts = {};
            // 統計所有項目的出現次數
            expensesList.forEach(exp => {
                if (exp.name === "💰 結清帳務") return; // 排除結清紀錄
                const name = exp.name.trim();
                if (name) {
                    nameCounts[name] = (nameCounts[name] || 0) + 1;
                }
            });

            // 根據出現次數排序，並取出前 5 名
            const sortedNames = Object.keys(nameCounts).sort((a, b) => nameCounts[b] - nameCounts[a]);
            const top5 = sortedNames.slice(0, 5);

            const container = document.getElementById('dynamicSearchTags');
            if (!container) return;
            
            container.innerHTML = '';
            
            if (top5.length === 0) {
                container.innerHTML = '<span class="text-gray-400 text-sm py-2 px-1">尚無常用紀錄</span>';
                return;
            }

            // 產生前 5 名的按鈕
            top5.forEach(name => {
                const btn = document.createElement('button');
                btn.className = "bg-white border border-gray-200 px-4 py-2 rounded-full text-gray-600 font-bold hover:bg-blue-50 hover:text-blue-600 hover:border-blue-200 transition-colors shadow-sm text-sm whitespace-nowrap flex-shrink-0";
                btn.textContent = name;
                btn.onclick = () => setSearchTag(name);
                container.appendChild(btn);
            });
            
            // 加上清除/顯示全部的按鈕
            const allBtn = document.createElement('button');
            allBtn.className = "bg-gray-100 border border-gray-200 px-4 py-2 rounded-full text-gray-700 font-bold hover:bg-gray-200 transition-colors shadow-sm text-sm whitespace-nowrap flex-shrink-0";
            allBtn.textContent = "顯示全部";
            allBtn.onclick = () => setSearchTag('');
            container.appendChild(allBtn);
        };
    window.onload = init;
</script>
